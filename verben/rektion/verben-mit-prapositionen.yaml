title: Verben mit festen Präpositionen (Rektion)
rules:
  Akk:
    - auf / über / für / an / um → Akkusativ
  Dat:
    - mit / nach / bei / von / zu → завжди Dativ
    - an / vor → Dativ (у цих дієсловах)
notes:
  Akk: |
    sich freuen має два значення:

    - auf → майбутнє
    - über → факт / теперішнє / минуле
verbs:
  - id: 1
    case: Akk
    präposition: auf
    verb: warten auf <Akk>
    translations:
      english: to wait for
      ukrainian: чекати на
    example:
      - Ich warte auf deine Antwort.
      - Worauf wartest du?
  - id: 2
    case: Akk
    präposition: auf
    verb: sich freuen auf <Akk>
    translations:
      english: to look forward to
      ukrainian: радіти (чомусь майбутньому) / з нетерпінням чекати
    example:
      - Ich freue mich auf meinen Urlaub.
  - id: 3
    case: Akk
    präposition: auf
    verb: sich vorbereiten auf <Akk>
    translations:
      english: to prepare for
      ukrainian: готуватися до
    example:
      - Ich bereite mich auf die Prüfung vor.
  - id: 4
    case: Akk
    präposition: über
    verb: sich freuen über <Akk>
    translations:
      english: to be happy about
      ukrainian: радіти (чомусь теперішньому/минулому)
    example:
      - Ich freue mich über unsere Party.
      - Ich freue mich sehr darüber.
  - id: 5
    case: Akk
    präposition: über
    verb: sprechen über <Akk>
    translations:

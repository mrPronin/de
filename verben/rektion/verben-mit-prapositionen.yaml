      ukrainian: дискутувати про
    example:
      - Ich diskutiere mit meinem Freund über ein neues Projekt.
  - id: 8
    case: Akk
    präposition: über
    verb: sich informieren über <Akk>
    translations:
      english: to inform oneself about
      ukrainian: інформувати себе про / дізнаватися про
    example:

title: "Unregelmäßige Verben - A2"
verbs:
  - id: 1
    infinitiv: beißen
    präteritum: biss
    partizip: hat gebissen
    level: B1
    translations:
      english: to bite
      ukrainian: кусати
    examples: |
      der Biss - укус
      das Gebiss - прикус
      
      in <Akk>
      
      an·beißen - bite; відкусити,
      
      beißende Kritik / Ironie
      
      Präsens:
        Der Hund beißt den Ball. / The dog bites the ball.
      
      Präteritum:
        Der Hund biss den Briefträger. / The dog bit the mailman.
      
      Perfekt:
        Der Hund hat den Ball gebissen. / The dog has bitten the ball.
    person3: beißt
      
  - id: 2
    infinitiv: biegen
    präteritum: bog
    partizip: hat / ist gebogen
    level: C1
    translations:
      english: to turn
      ukrainian: згинати, повертати
    examples: |
      ab·biegen - turn; повертати
      
      der Bogen - арка
      der Regenbogen - веселка
      der Geigenbogen - смичок
      die Geige - скрипка 
      
      Beispiele
        Du biegst nach links ab. / You turn to the left.
        Sie haben die Regeln gebogen, um ihre Ziele zu erreichen. / They have bent the rules to achieve their goals.
      
      Präsens:
        Ich biege das Metall. / I bend the metal.
      
      Präteritum:
        Ich bog den Draht. / I bent the wire.
      
      Perfekt:
        Ich habe das Metall gebogen. / I have bent the metal.
    person3: biegt
      
  - id: 3
    infinitiv: brechen
    präteritum: brach
    partizip: hat gebrochen
    level: B1
    translations:
      english: to break, destroy
      ukrainian: зламати, розбити
    examples: |
      erbrechen - throw up, vomit; блювати
      das Erbrechen - блювота
      der Bruch - поломка, несправність
      der Knochenbruch - перелом кістки
      der Glasbruch - поломка скла
      der Bruchteil - частина, дріб
      zerbrechen - to break into pieces, shatter; розбити на шматки, розсипати
      (C2, inseparable prefix; auxiliary: sein/haben)

      Präsens:
        Ich breche das Brot. / I break the bread.

      Präteritum:
        Er brach das Glas. / He broke the glass.

      Perfekt:
        Sie hat den Stift gebrochen. / She has broken the pen.
    person3: bricht

  - id: 4
    infinitiv: befehlen
    präteritum: befahl
    partizip: hat befohlen
    level: B2
    translations:
      english: to order, command
      ukrainian: наказувати
    examples: |
      <Dat>
      
      Präsens:
        Der Offizier befiehlt den Soldaten, zu marschieren. / The officer commands the soldiers to march.
      
      Präteritum:
        Der General befahl den Angriff. / The general commanded the attack.
      
      Perfekt:
        Der König hat dem Diener befohlen, das Tor zu öffnen. / The king has commanded the servant to open the gate.
    person3: befiehlt
      
  - id: 5
    infinitiv: betrügen
    präteritum: betrog
    partizip: hat betrogen
    level: B1
    translations:
      english: to fool, diddle
      ukrainian: обманювати
    examples: |
      der Betrug - deception, fraud; обман
      
      Präsens:
        Er betrügt bei den Hausaufgaben. / He cheats on the homework.
      
      Präteritum:
        Sie betrog ihren Freund. / She cheated on her boyfriend.
      
      Perfekt:
        Ich habe ihn nie betrogen. / I have never cheated on him.
    person3: betrügt
      
  - id: 6
    infinitiv: blasen
    präteritum: blies
    partizip: hat geblasen
    level: C2
    translations:
      english: to blow, play (instrument), signal, puff
      ukrainian: дути, сурмити, грати на духовому, сигналізувати
    examples: |
      die Blase - bubble; бульбашка
      die Harmblase - urinary bladder; сечовий міхур
      die Galenblase - gallbladder; жовчний міхур
      das Blasinstrument - wind instrument; духовий інструмент
      
      ausblasen - blow out; видути, вивітрювати
      
      Präsens:
        Der Wind bläst stark. / The wind blows strongly.
      
      Präteritum:
        Der Wind blies gestern heftig. / The wind blew heavily yesterday.
      
      Perfekt:
        Der Wind hat die ganze Nacht stark geblasen. / The wind has blown strongly all night.
    person3: bläst
      
  - id: 7
    infinitiv: backen
    präteritum: buk, backte
    partizip: hat gebacken
    level: B1
    translations:
      english: to bake
      ukrainian: пекти
    examples: |
      <Akk>
      
      der Bäcker - baker; пекар
      das Backen - baking; печеня
      das Gebäck - baked goods; випічка
      
      Präsens:
        Ich backe einen Kuchen. / I bake a cake.
      
      Präteritum:
        Sie buk gestern Brot. / She baked bread yesterday.
      
      Perfekt:
        Er hat einen Apfelkuchen gebacken. / He has baked an apple pie.
    person3: backt/bäckt
      
  - id: 8
    infinitiv: brennen
    präteritum: brannte
    partizip: hat gebrant
    level: B1
    translations:
      english: to burn
      ukrainian: горіти
    examples: |
      der Brandt, Brände - пожар
      verbrennen - burn; спалювати
      
      Präsens:
        Das Feuer brennt hell. / The fire burns brightly.
      
      Präteritum:
        Das Holz brannte gut. / The wood burned well.
      
      Perfekt:
        Die Kerze hat lange gebrannt. / The candle has burned for a long time.
    person3: brennt
      
  - id: 9
    infinitiv: bringen
    präteritum: brachte
    partizip: hatgebracht
    level: B1
    translations:
      english: to bring
      ukrainian: приносити
    examples: |
      der Bringer - bringer; приносити
      der Glücksbringer - то, що приносить щастя
      mitbringen - приносити з собою
      
      Präsens:
        Ich bringe dir ein Geschenk. / I bring you a gift.
      
      Präteritum:
        Er brachte das Buch zur Schule. / He brought the book to school.
      
      Perfekt:
        Sie hat den Kuchen zur Party gebracht. / She has brought the cake to the party.
    person3: bringt
      
  - id: 10
    infinitiv: bitten
    präteritum: bat
    partizip: hat gebeten
    level: B1
    translations:
      english: to ask a favour, appeal, plead
      ukrainian: просити
    examples: |
      die Bitte - прохання 
      die Bitte um <Akk>
      
      Präsens:
        Ich habe eine Bitte an Sie. / I have a request to you.
        Ich bitte dich um Hilfe. / I ask you for help.
      
      Präteritum:
        Er bat mich um einen Gefallen. / He asked me for a favor.
      
      Perfekt:
        Sie hat mich um Unterstützung gebeten. / She has asked me for support.
    person3: bittet
  
  - id: 11
    level: B1
    infinitiv: fangen
    präteritum: fing
    partizip: hat gefangen
    translations:
      english: to catch
      ukrainian: ловити
    person3: fängt
    examples: |
      fangen <Akk>

      an-, - починати
      empfangen - приймати
      empfangen - der Empfang
      anfangen mit <Dat> - der Anfang

      **Substantive**:
        der Fänger / catcher / захоплювач
        der Fang / catch - захоплення
        der Gefangene / caught / ув'язнений
        das Gefängnis / prison / в'язниця
        der Empfang / the reception / прийом
        der Anfang / the beginning / початок
        
      **Präsens**:
        Ich fang an, ein neues Buch zu lesen.

      **Präteritum**:
        Ich fing an, mit dem neuen Job zu arbeiten.

      **Perfekt**:
        Ich habe angefangen, mit dem neuen Job zu arbeiten.

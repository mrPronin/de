title: "Unregelmäßige Verben - A2"
verbs:
  - id: 1
    level: A2
    infinitiv: beschreiben
    präteritum: beschrieb
    partizip: hat beschrieben
    translations:
      english: to describe
      ukrainian: описувати
    person3: beschreibt
    examples: |
      Sie beschreibt das Bild. / She describes the picture.
      Er hat es beschrieben. / He has described it.
  - id: 2
    level: A2
    infinitiv: besprechen
    präteritum: besprach
    partizip: hat besprochen
    translations:
      english: to discuss
      ukrainian: обговорювати
    person3: bespricht
    examples: |
      Wir haben das Projekt diskutiert. / We discussed the project.
      Sie hat es besprochen. / She has discussed it.
  - id: 3
    level: A2
    infinitiv: sich bewerben
    präteritum: bewarb sich
    partizip: hat sich beworben
    translations:
      english: to apply (for a job)
      ukrainian: афілігуватися
    person3: sich bewerbst
    examples: |
      Ich bewende mich um eine Stelle an. / I apply for a job.
      Sie hat sich beworben. / She has applied.
  - id: 4
    level: A2
    infinitiv: bringen
    präteritum: brachte
    partizip: hat gebracht
    translations:
      english: to bring
      ukrainian: приносити
    person3: bringt
    examples: |
      Ich bringe dir ein Buch. / I bring you a book.
      Sie hat das Geld gebracht. / She brought the money.
  - id: 5
    level: A2
    infinitiv: backen
    präteritum: buk / backte
    partizip: hat gebacken
    translations:
      english: to bake
      ukrainian: пекти
    person3: backt
    examples: |
      Ich backe einen Kuchen. / I bake a cake.
      Sie hat den Kuchen gebacken. / She baked the cake.
  - id: 6
    level: A2
    infinitiv: empfehlen
    präteritum: empfahl
    partizip: hat empfohlen
    translations:
      english: to recommend
      ukrainian: рекомендувати
    person3: empfiehlt
    examples: |
      Ich empfehle dir dieses Buch. / I recommend this book to you.
      Er hat mir einen Film empfohlen. / He recommended a film to me.
  - id: 7
    level: A2
    infinitiv: empfangen
    präteritum: empfing
    partizip: hat empfangen
    translations:
      english: to receive
      ukrainian: отримувати
    person3: empfängt
    examples: |
      Wir haben die Nachrichten empfangen. / We received the messages.
      Sie hat das Paket empfangen. / She received the package.
  - id: 8
    level: A2
    infinitiv: fallen
    präteritum: fiel
    partizip: ist gefallen
    translations:
      english: to fall
      ukrainian: падати
    person3: fällt
    examples: |
      Der Apfel fällt vom Baum. / The apple falls from the tree.
      Der Apfel fiel vom Baum. / The apple fell from the tree.
  - id: 9
    level: A2
    infinitiv: abfahren
    präteritum: fuhr ab
    partizip: ist abgefahren
    translations:
      english: to depart
      ukrainian: відъїдати
    person3: abfährt
    examples: |
      Der Zug fährt ab. / The train departs.
      Das Schiff ist abgefahren. / The ship has departed.
  - id: 10
    level: A2
    infinitiv: abgeben
    präteritum: gab ab
    partizip: hat abgegeben
    translations:
      english: to hand in, give up
      ukrainian: віддавати
    person3: abgibt
    examples: |
      Ich gebe den Auftrag ab. / I hand in the order.
      Er hat das Dokument abgegeben. / He has handed in the document.
  - id: 11
    level: A2
    infinitiv: gefallen
    präteritum: gefiel
    partizip: hat gefallen
    translations:
      english: to like
      ukrainian: подобатися
    person3: gefällt
    examples: |
      Wie gefällt dir der Film? / How do you like the film?
      Der Film gefiel mir. / The film suited me.
  - id: 12
    level: A2
    infinitiv: gewinnen
    präteritum: gewann
    partizip: hat gewonnen
    translations:
      english: to win
      ukrainian: вигравати, добувати
    person3: gewinnt
    examples: |
      Sie gewinnt oft bei Lotterien. / She often wins at lotteries.
      Er hat den Preis gewonnen. / He has won the prize.
  - id: 13
    level: A2
    infinitiv: halten
    präteritum: hielt
    partizip: hat gehalten
    translations:
      english: to hold
      ukrainian: тримати
    person3: hält
    examples: |
      Ich halte das Buch. / I hold the book.
      Sie hat es gehalten. / She has held it.
  - id: 14
    level: A2
    infinitiv: ankommen
    präteritum: kam an
    partizip: ist / gekommen
    translations:
      english: to arrive
      ukrainian: прийти
    person3: ankommt
    examples: |
      Der Zug ist angekommen. / The train has arrived.
      Sie ist angekommen. / She has arrived.
  - id: 15
    level: A2
    infinitiv: einladen
    präteritum: lud ein
    partizip: hat eingeladen
    translations:
      english: to invite
      ukrainian: запрошувати
    person3: einlädt
    examples: |
      Ich lade dich zur Party ein. / I invite you to the party.
      Sie hat mich eingeladen. / She invited me.
  - id: 16
    level: A2
    infinitiv: abnehmen
    präteritum: nahm ab
    partizip: hat abgenommen
    translations:
      english: to dismiss
      ukrainian: звільнити
    person3: abnimmt
    examples: |
      Der Boss hat ihn abgenommen. / The boss dismissed him.
      Sie hat die Position abgenommen. / She dismissed the position.
  - id: 17
    level: A2
    infinitiv: annehmen
    präteritum: nahm an
    partizip: hat angenommen
    translations:
      english: to accept
      ukrainian: приймати
    person3: annimmt
    examples: |
      Ich nehme deine Hilfe an. / I accept your help.
      Sie hat den Vorschlag angenommen. / She accepted the proposal.
  - id: 18
    level: A2
    infinitiv: anrufen
    präteritum: rief an
    partizip: hat angerufen
    translations:
      english: to call (phone)
      ukrainian: звонити
    person3: anruft
    examples: |
      Ich rufe dich an. / I call you.
      Sie hat mich angerufen. / She called me.
  - id: 19
    level: A2
    infinitiv: ansehen
    präteritum: sah an
    partizip: hat angesehen
    translations:
      english: to look at
      ukrainian: дивитися
    person3: ansieht
    examples: |
      Ich sehe dich an. / I look at you.
      Sie hat es angesehen. / She looked at it.
  - id: 20
    level: A2
    infinitiv: einschlafen
    präteritum: schlief ein
    partizip: ist / eingeschlafen
    translations:
      english: to fall asleep
      ukrainian: заснувати
    person3: einschläft
    examples: |
      Er hat einschlafen. / He fell asleep.
      Sie ist eingeschlafen. / She has fallen asleep.
  - id: 21
    level: A2
    infinitiv: verlassen
    präteritum: verließ
    partizip: hat / verlassen
    translations:
      english: to leave
      ukrainian: відъїдати, залишати
    person3: verlässt
    examples: |
      Ich verlasse den Raum. / I leave the room.
      Sie hat verlassen. / She has left.
  - id: 22
    level: A2
    infinitiv: werden
    präteritum: wurde
    partizip: ist / geworden
    translations:
      english: to become
      ukrainian: становитися
    person3: wird
    examples: |
      Er wird Lehrer. / He will become a teacher.
      Sie ist geworden. / She has become.
  - id: 23
    level: A2
    infinitiv: ziehen
    präteritum: zog
    partizip: hat / ist / gezogen
    translations:
      english: to pull, draw
      ukrainian: тягати
    person3: zieht
    examples: |
      Ich ziehe die Tür. / I pull the door.
      Sie hat gezogen. / She pulled.

title: "Unregelmäßige Verben - A2"
verbs:
  - id: 1
    infinitiv: backen
    präteritum: backte
    partizip: hat gebacken
    translations:
      english: to bake
      ukrainian: пекти
    person3: backt
    examples: |
      <Akk>

      **Substantive**:
        der Bäcker / the baker / пекар
        das Backen / the baking / печеня
        das Gebäck / the pastry / випічка
        den Kuchen / the cake / торт
        die Bäckerei / the bakery / пекарня

      mit <Dat> backen = zu backen gehen
      
      **Präsens**:
        Ich backe einen Kuchen. / I bake a cake.
      
      **Präteritum**:
        Sie buk gestern Brot. / She baked bread yesterday.
      
      **Perfekt**:
        Er hat einen Apfelkuchen gebacken. / He has baked an apple pie.
  
  - id: 2
    infinitiv: biegen
    präteritum: bog
    partizip: hat / ist gebogen
    translations:
      english: to turn, bend
      ukrainian: згинати, повертати
    person3: biegt
    examples: |
      **trennbare Verben**:
        abbiegen - to turn ( in transport) / повертати (в транспортних засобах); abbiegen links / rechts

      **Substantive**:
        der Bogen - арка
        der Regenbogen - веселка
        der Geigenbogen - смичок
        die Geige - скрипка
      
      **Beispiele**:
        - Du biegst nach links ab. / You turn left.
        - Sie haben die Regeln gebogen, um ihre Ziele zu erreichen. / They have bent the rules to achieve their goals.
        - Er biegt den Arm. / He bends his arm.
        - Er hat das Bein gebogen. / He has bent his leg.
        - Das Auto ist um die Ecke gebogen. / The car is bent around the corner.

      **Präsens**:
        Ich biege das Metall. / I bend the metal.
      
      **Präteritum**:
        Ich bog den Draht. / I bent the wire.
      
      **Perfekt**:
        Ich habe das Metall gebogen. / I have bent the metal.

  - id: 3
    infinitiv: bieten
    präteritum: bot
    partizip: hat geboten
    translations:
      english: to offer
      ukrainian: пропонувати, надавати можливість
    person3: bietet
    examples: |
      bieten jemandem <Dat> etwas <Akk> - пропонувати кому <Dat> що <Akk>

      **trennbare Verben**:
        - anbieten - to offer / пропонувати щось конкретне (товар, послугу), часто цілеспрямовано комусь
          Ich biete dir meine Hilfe an. / I offer you my help.
        - aufbieten - to mobilize, to summon / мобілізувати, прикладати зусилля
          Wir bieten alle Kräfte auf. / We mobilize all forces. / Ми мобілізуємо всі сили.
        - ausbieten - to auction, to put up for sale / виставляти на продаж (аукціон)
          Er bietet sein Auto für 1000 € aus. / He puts his car up for sale for 1000 €. / Він виставляє свою машину за 1000 €.
        - darbieten - to present, to perform / представляти, виконувати (на сцені)
          Die Künstler bieten ein schönes Konzert dar. / The artists offer a beautiful concert. / Артисти виконують чудовий концерт.

      **Substantive**:
        das Angebot - offer / пропозиція
      
      **Beispiele**:
        - Ich biete ihm einen Kaffe. / I offer him a coffee.
        - Auf dem Markt gibt es ein reines Angebot. / There is a pure offer on the market.
        - Das Leben bietet uns Millionen von Möglichkeiten. / Life offers us millions of possibilities. / Життя пропонує нам мільйони можливостей.
        - Kann ich Ihnen einen Kaffee anbieten? / Can I offer you a coffee? / Я можу вам запропонувати каву?
        - Es gibt ein reiches Angebot an Waren. / There is a rich offer of goods. / Є багато товарів.
        - Eine so gute Chance bietet sich nicht oft. / Such a good chance does not often occur. / Така можливість трапляється не часто.

      **Präsens**:
        - Ich biete ihnen einen Kaffe. / I offer them a coffee. / Я пропоную їм каву.
        - Ich biete dir meine Hilfe. / I offer you my help. / Я пропоную вам свою допомогу.
      
      **Präteritum**:
        - Er bot mir seine Unterstützung. / He offered me his support. / Він запропонував мені свою підтримку.
      
      **Perfekt**:
        - Sie hat mir einen guten Preis geboten. / She offered me a good price. / Вона запропонувала мені хорошу ціну.        

  - id: 4
    infinitiv: bitten
    präteritum: bat
    partizip: hat gebeten
    translations:
      english: to ask (a favour), request
      ukrainian: просити
    person3: bittet
    examples: |
      bitten um <Akk>
      
      **nicht trennbare Verben**:
        - verbitten - to forbid (formally) / суворо забороняти (офіційно)
          Ich verbitte mir diesen Ton. / I forbid this tone. / Я не дозволяю такого тону.
        - erbitten - to request, to ask for / благально просити
          Ich habe den Urlaub erbeten. / I have asked for a vacation. / Я попросив про відпустку.
        - überbitten - to outbid / перепросити, перебити ставку
          Er hat mich beim Preis überboten. / He outbid me on the price. / Він запропонував вищу ціну.
      
      **Substantive**:
        - die Bitte - the request / прохання
      
      **Beispiele**:
        - Ich habe eine Bitte an Sie. / I have a request for you. / У мене до вас прохання.
        - Er bittet um die Hilfe. / He asks for help. / Він просить про допомогу.

      **Präsens**:
        - Ich bitte dich um Hilfe. / I ask you for help. / Я прошу вас про допомогу.
      
      **Präteritum**:
        - Er bat mich um einen Gefallen. / He asked me for a favor. / Він попросив мене про послугу.
      
      **Perfekt**:
        - Sie hat mich um Unterstützung gebeten. / She has asked me for support. / Вона попросила мене про підтримку.

  - id: 5
    infinitiv: braten
    präteritum: briet
    partizip: hat gebraten
    translations:
      english: to bake, fry, roast
      ukrainian: смажити
    person3: brät
    examples: |
      **trennbare Verben**:
        - anbraten - to sear, to brown / підсмажувати
          Ich brate das Fleisch scharf an. / I sear the meat. / Я підсмажую м’ясо на сильному вогні.
        - durchbraten - to cook through / просмажувати наскрізь
          Das Steak soll gut durchgebraten sein. / The steak should be well-cooked through. / Стейк має бути добре просмажений.
        - mitbraten - to fry together (with) / смажити разом (з)
          Die Zwiebeln braten wir mit dem Fleisch mit. / We fry the onions with the meat. / Ми смажимо цибулю разом із м’ясом.

      **Substantive**:
        - der Braten - the roast / печеня
        - der Gänsebraten - roast goose / смажена гуска
      
      **Beispiele**:
        - Er brät Wurst. / He fries sausage. / Він смажить ковбасу.
        - die Bratwurst schmeckt lecker. / the sausage tastes good. / ковбаса смачна.

      **Präsens**:
        - Ich brate das Fleisch in der Pfanne. / I fry the meat in the pan. / Я смажу м'ясо на сковороді.
      
      **Präteritum**:
        - Ich bratete das Fleisch. / I fried the meat. / Я смажив м'ясо.
        - Er briet gestern das Gemüse. / He fried the vegetables yesterday. / Він смажив овочі вчора.
      
      **Perfekt**:
        - Er hat das Fleisch gebraten. / He has fried the meat. / Він смажив м'ясо.
        - Sie hat das Hähnchen im Ofen gebraten. / She has roasted the chicken in the oven. / Вона смажила курятину в духовці.

  - id: 6
    infinitiv: fallen
    präteritum: fiel
    partizip: ist gefallen
    translations:
      english: to fall
      ukrainian: падати
    person3: fällt
    examples: |
      fallen - wohin- <Akk>

      **trennbare Verben**:
        - hinfallen - to fall down (on the ground) / падати на землю
          - Er fällt oft beim Laufen hin. / He often falls when running. / Він часто падає під час бігу.
        - auffallen <Dat> - to stand out, to be noticeable / кидатись в очі, бути помітним
          - Mir fällt auf, dass du heute sehr ruhig bist. / I notice that you are very quiet today. / Я помічаю, що ти сьогодні дуже тихий.
        - einfallen - to come to mind, collapse / спадати / спадати на думку
          - Mir fällt nichts Gutes ein. / Nothing good comes to mind. / Мені нічого не спадає на думку.
        - ausfallen - to fail, be canceled / випадати, скасовуватися
          - Der Unterricht fällt heute aus. / The lesson is canceled today. / Заняття сьогодні скасовуються.
        - abfallen - to fall off / відпадати
          - Die Blätter fallen im Herbst ab. / The leaves fall in autumn. / Листя опадає восени.
        - herunterfallen - to fall down / падати вниз
          - Das Glas ist heruntergefallen. / The glass has fallen. / Склянка впала вниз.
        - durchfallen - to fail (exam) / провалювати
          - Ich bin durch die Prüfung gefallen. / I failed the exam. / Я провалив іспит.

      **Substantive**:
        - der Fall - auf keinen Fall / auf jeden Fall / the case / падіння, випадок
        - der Zufall - the coincidence / збіг, випадковість
        - der Durchfall - the failure / провал

      **Beispiele**:
        - die Temperaturen fallen / the temperatures fall / Температури падають.
        - die Preise fallen / the prices fall / Ціни падають
        - im Krieg fallen / in the war fall / відбувається війна
        - durch die Prüfung fallen / through the test fall / провалився тест
        - einen Baum fallen / a tree fall / впало дерево
        - Die Mathe ist heute ausgefallen. / The math is canceled today. / Математика сьогодні скасовується.

      **Präsens**:
        - Der Apfel fällt vom Baum. / The apple falls from the tree. / Яблуко падає з дерева.
      
      **Präteritum**:
        - Der Apfel fiel vom Baum. / The apple fell from the tree. / Яблуко впало з дерева.
      
      **Perfekt**:
        - Der Apfel ist vom Baum gefallen. / The apple has fallen from the tree. / Яблуко впало з дерева.

  - id: 7
    infinitiv: gefallen
    präteritum: gefiel
    partizip: hat gefallen
    translations:
      english: to like
      ukrainian: подобатися
    person3: gefällt
    examples: |
      gefallen - j-m

      **trennbare Verben**:

      **Substantive**:
        - der Gefallen - the favor / послуга; j-m einen Gefallen tun
      
      **Beispiele**:
        - Wie gefällt dir der Film? / How do you like the film? / Як вам фільм?
        - Was gefällt dir an diesem Film? / What do you like about this film? / Що вам подобається в цьому фільмі?

      **Präsens**:
        - Ich gefällt dir. / I like you. / Я вам подобаюся.
        - Der Film gefällt mir. / The film suits me. / Мене подобається цей фільм.
        
      **Präteritum**:
        - Ich gefiel dir. / I liked you. / Я вам подобався.
        - Der Film gefiel mir. / The film suited me. / Мене подобався цей фільм.
      
      **Perfekt**:
        - Ich gefiel dir. / I liked you. / Я вам подобався.
        - Der Film gefiel mir. / The film suited me. / Мене подобався цей фільм.

  - id: 8
    infinitiv: gewinnen
    präteritum: gewann
    partizip: hat gewonnen
    translations:
      english: to win
      ukrainian: вигравати, добувати (копалини)
    person3: gewinnt
    examples: |
      **trennbare Verben**:
        - dazu | gewinnen - to gain additionally / набувати додатково
          - Mit dem neuen Projekt gewinnen wir viel Erfahrung dazu. / With the new project we gain a lot of experience. / З новим проектом ми отримуємо багато досвіду.
        - zurück | gewinnen - to win back / повертати (назад)
          - Wir müssen das Vertrauen unserer Kunden zurückgewinnen. / We must win back the trust of our customers. / Ми повинні повернути довіру наших клієнтів.

      **nicht trennbare Verben**:
        - gewinnen (без префікса) – to win, to gain / вигравати, здобувати

      **Substantive**:
        - der Gewinn / -e - прибуток; der Verlust / -e - збиток
      
      **Beispiele**:
        - einen Wettkampf gewinnen / to win a competition / виграти змагання
        - den Krieg gewinnen / to win the war / виграти війну
        - die Eisenerz gewinnen / extract iron ore / видобувати залізну руду
        - die Kunden gewinnen / to win customers / завоювати клієнтів
        - einen Preis gewinnen / to win a prize / виграти приз
        - Vertrauen gewinnen / to win trust / завоювати довіру
        - das Erdöl gewinnen / to extract oil / видобувати нафту
        - den Gewinn erwirtschaften / to make a profit / отримувати прибуток

      **Präsens**:
        - Sie gewinnt oft bei Lotterien. - She often wins at lotteries. / Вона часто виграє в лотереї.
      
      **Präteritum**:
        - Sie gewann oft bei Lotterien. - She won often at lotteries. / Вона часто вигравала в лотереї.
      
      **Perfekt**:
        - Sie hat oft bei Lotterien gewonnen. - She won often at lotteries. / Вона часто вигравала в лотереї.

  - id: 9
    infinitiv: laden
    präteritum: lud
    partizip: hat geladen
    translations:
      english: to load, to charge
      ukrainian: вантажити
    person3: lädt
    examples: |
      laden etw. wohin?

      **trennbare Verben**:

      **Substantive**:
        - aufladen - to charge / заряджати
          - Ich lade mein Handy auf. – I charge my phone. / Я заряджаю свій телефон.
        - einladen - to invite / запрошувати
          - Ich lade dich zur Party ein. – I invite you to the party. / Я запрошую тебе на вечірку.
        - herunterladen - to download / завантажувати (з інтернету)
          - Ich lade die Datei herunter. – I download the file. / Я завантажую файл.
        - hochladen - to upload / завантажувати (в інтернет)
          - Ich lade das Video hoch. – I upload the video. / Я завантажую відео.
        - ausladen - to unload / розвантажувати
          - Ich lade den Kofferraum aus. – I unload the trunk. / Я розвантажую багажник.
        - umladen - to reload / перевантажувати
      
      **Beispiele**:
        - auf einen LKW laden / to load a truck / вантажити вантаж на вантажівку


      **Präsens**:
        - Ich lade mein Handy auf. - I charge my phone. / Я заряджаю свій телефон.
        - Sie laden das Gepäck in den Kofferraum des Autos. / They load the luggage into the trunk of the car. / Вони вантажують багаж у багажник автомобіля.
      
      **Präteritum**:
        - Gestern lud ich meine Freunde zum Essen ein. - Yesterday, I invited my friends for dinner. / Вчора я запросив своїх друзів на вечерю.
        - Letzte Woche luden wir den Lieferwagen mit den Paketen. - Last week we loaded the van with the parcels. / Ми вантажили вантажівку пакетами.
      
      **Perfekt**:
        - Ich habe mein Auto gerade vollgetankt und die Batterie geladen. - I have just refueled my car and charged the battery. / Я щойно заправил машину і зарядив акумулятор.
        - Ich habe gestern mein Fahrrad aufgeladen. - Yesterday, I charged my bicycle. / Вчора я зарядив велосипед.
        - Er hat das Dokument auf den USB-Stick geladen. - He loaded the document onto the USB stick. / Він завантажив документ на USB-накопичувач.

